{% extends "base.html" %}
{% load static %}
{% load i18n %}


{% block extrastyle %}

<style>
.chart-toolbar{
    display:flex;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    padding:15px;
    margin-bottom:20px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
}


.toolbar-group{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:170px;
}


.toolbar-group label{
    font-size:13px;
    font-weight:600;
}


.toolbar-group select{
    min-width:170px;
    min-height:40px;
    height:auto;
    padding:6px 10px;
    line-height:1.5;
}
.generate-btn{
    height:40px;
    padding:6px 18px;
    cursor:pointer;
    margin-top:25px;
}
</style>
{% endblock %}

{% block content %}
<div class="content">
<div class="chart-toolbar">

    <div class="toolbar-group">
        <label for="chartType">{% trans "Chart" %}</label>
        <select id="chartType">
            <option value="bar"> {% trans "Bar Chart" %}</option>
            <option value="line"> {% trans "Line Chart" %}</option>
            <option value="pie"> {% trans "Pie Chart" %}</option>
            <option value="doughnut">  {% trans "Doughnut Chart" %}</option>
            <option value="polarArea">{% trans "Polar Area Chart" %}</option>
            <option value="radar"> {% trans "Radar Chart" %}</option>
        </select>
    </div>

    <div class="toolbar-group">
        <label for="model">{% trans "Table" %}</label>
        <select id="model"></select>
    </div>

    <div class="toolbar-group">
        <label for="dimension">{% trans "Dimension" %}</label>
        <select id="dimension"></select>
    </div>

    <div class="toolbar-group">
        <label for="measure">{% trans "Measure" %}</label>
        <select id="measure"></select>
    </div>

    <div class="toolbar-group">
        <label for="date_granularity">{% trans "Date Grouping" %}</label>
        <select id="date_granularity" disabled>
            <option value="">{% trans "None" %}</option>
            <option value="day">{% trans "Day" %}</option>
            <option value="week">{% trans "Week" %}</option>
            <option value="month">{% trans "Month" %}</option>
            <option value="quarter">{% trans "Quarter" %}</option>
            <option value="year">{% trans "Year" %}</option>
        </select>
    </div>

    <div class="toolbar-group">
        <label for="aggregation">{% trans "Aggregation" %}</label>
        <select id="aggregation">
            <option value="count">{% trans "Count" %}</option>
            <option value="sum">{% trans "Sum" %}</option>
            <option value="avg">{% trans "Average" %}</option>
            <option value="min">{% trans "Minimum" %}</option>
            <option value="max">{% trans "Maximum" %}</option>
        </select>
    </div>

    <button type="button" class="generate-btn" onclick="generateChart()">
        {% trans "Generate Chart" %}
    </button>

</div>

<div class="chart-container">
    <canvas id="chart"></canvas>
</div>
{% trans "Record Count" as msg_record_count %}
{% trans "Time Series" as msg_time_series %}
<script>
let fieldMeta = {};
let chart = null;

const dashboardColors = [
    '#CB52E3',
    '#B94CD1',
    '#A947BF',
    '#973FAD',
    '#85389B',
    '#D46DEA',
    '#DE88EF',
    '#E7A3F4',
    '#F1BEF8',
    '#FAD9FD'
];

// =========================
// LOAD MODELS
// =========================
fetch("/analytics/models/")
.then(r => r.json())
.then(data => {
    let m = document.getElementById("model");

    data.models.forEach(v => {
        let o = document.createElement("option");
        o.value = v;
        o.text = v;
        m.appendChild(o);
    });

    loadFields();
});

document.getElementById("model").addEventListener("change", loadFields);
document.getElementById("measure").addEventListener("change", updateAggregationOptions);
document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "dimension") {
        updateDateOptions();
    }
});



// =========================
// DATE LOGIC (ROBUST VERSION)
// =========================
function isDateField(fieldName) {

    if (!fieldMeta[fieldName]) {
        return false;
    }

    return fieldMeta[fieldName].isDate;
}


function updateDateOptions() {
    const dimensionEl = document.getElementById("dimension");
    const granularityEl = document.getElementById("date_granularity");

    const selectedField = dimensionEl.value;

    console.log("Selected field:", selectedField);
    console.log("Detected type:", fieldMeta[selectedField]);

    const isDate = isDateField(selectedField);

    if (isDate) {
        granularityEl.disabled = false;
    } else {
        granularityEl.value = "";
        granularityEl.disabled = true;
    }
}



// =========================
// LOAD FIELDS
// =========================
function loadFields() {
    let model = document.getElementById("model").value;

    fetch(`/analytics/fields/${model}/`)
    .then(r => r.json())
    .then(data => {

        const dimensionSelect = document.getElementById("dimension");
        const measureSelect = document.getElementById("measure");

        dimensionSelect.innerHTML = "";
        measureSelect.innerHTML = "";

        fieldMeta = {};

        // DIMENSIONS
        data.fields.forEach(field => {

            fieldMeta[field.name] = {
                type: field.type,
                isDate: field.is_date,
                isNumeric: field.is_numeric,
            };

            const option = document.createElement("option");
            option.value = field.name;
            option.text = field.name;

            dimensionSelect.appendChild(option);
        });

        // MEASURES
        measureSelect.innerHTML = '<option value="">{{ msg_record_count }}</option>';

// normal numeric measures
        data.semantic.measures.forEach(field => {
            const option = document.createElement("option");
            option.value = field;
            option.text = field;
            measureSelect.appendChild(option);
        });

        // =========================
        // 🔥 ADD DATE FIELDS AS MEASURES
        // =========================
        if (data.semantic.measures_extended) {
            data.semantic.measures_extended.forEach(field => {
                const option = document.createElement("option");
                option.value = field.name;
                option.text = "📅 " + field.name;
                option.dataset.type = "date";   // important flag
                measureSelect.appendChild(option);
            });
}

        // default selection
        if (dimensionSelect.options.length > 0) {
            dimensionSelect.selectedIndex = 0;
        }

        updateAggregationOptions();
        updateDateOptions();
    });
}

// =========================
// GENERATE CHART
// =========================
function generateChart() {
    const measureEl = document.getElementById("measure");
    const selectedMeasureOption = measureEl.options[measureEl.selectedIndex];

    const model =
        document.getElementById("model").value;

    const dimension =
        document.getElementById("dimension").value;

    const measure =
        document.getElementById("measure").value;

    const isDateMeasure =
        selectedMeasureOption?.dataset?.type === "date";
        
    const aggregation =
        document.getElementById("aggregation").value;

    const chartType =
        document.getElementById("chartType").value;

    const date_granularity =
        document.getElementById("date_granularity").value;

    const label =
    isDateMeasure
        ? `{{ msg_time_series }} (${selectedMeasureOption.value})`
        : (measure ? `${aggregation.toUpperCase()} ${measure}` : "Record Count");
        
    fetch(
    `/analytics/chart/?model=${model}` +
    `&x=${dimension}` +
    `&measure=${isDateMeasure ? "" : measure}` +
    `&aggregation=${aggregation}` +
    `&date_granularity=${date_granularity}` +
    `&time_measure=${isDateMeasure ? measure : ""}`
)
    .then(r => r.json())
    .then(data => {

        if (chart) chart.destroy();
        
        chart = new Chart(
            document.getElementById("chart"),
            {
                type: chartType,
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: label,

                        data: data.values,

                        backgroundColor:
                            ["pie","doughnut","polarArea"].includes(chartType)
                                ? dashboardColors.slice(0, data.values.length)
                                : dashboardColors[0],

                        borderColor:
                            ["pie","doughnut","polarArea"].includes(chartType)
                                ? dashboardColors.slice(0, data.values.length)
                                : dashboardColors[0],

                        borderWidth: 2,
                        fill: chartType === "line",
                        tension: 0.3,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                }
            }
        );
    });
}
function updateAggregationOptions() {
    const measureEl = document.getElementById("measure");
    const aggregation = document.getElementById("aggregation");

    const selectedOption = measureEl.options[measureEl.selectedIndex];
    const isDate = selectedOption?.dataset?.type === "date";

    if (measureEl.value === "" || isDate) {
        aggregation.value = "count";

        Array.from(aggregation.options).forEach(option => {
            option.disabled = option.value !== "count";
        });
    } else {
        Array.from(aggregation.options).forEach(option => {
            option.disabled = false;
        });
    }
}
</script>

{% endblock %}
