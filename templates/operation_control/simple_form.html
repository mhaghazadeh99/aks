{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="content" style="max-width:1000px;">
  <h2 style="margin-bottom:6px;">{{ title }}</h2>
  {% if subtitle %}<p style="color:#666; margin-bottom:20px;">{{ subtitle }}</p>{% endif %}
  <form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {% crispy form %}
    <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
      <button type="submit" class="btn-blue">{% trans "Save" %}</button>
      <a href="{% if cancel_url_raw %}{{ cancel_url_raw }}{% else %}{% url cancel_url %}{% endif %}" class="btn-gray">{% trans "Cancel" %}</a>
      {% if delete_label %}
        <button type="submit" name="delete" value="1" class="btn btn-danger"
                onclick="return confirm('{% trans 'Are you sure?' %}');" formnovalidate>{{ delete_label }}</button>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
